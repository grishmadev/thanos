# Minimal config: /etc/haproxy/haproxy.cfg
global
    daemon

defaults
    mode tcp
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend lb
    bind :8080
    mode tcp
    default_backend servers

backend servers
    mode tcp
    balance leastconn
    server s1 127.0.0.1:8888
    server s2 127.0.0.1:8889
    server s3 127.0.0.1:8890

